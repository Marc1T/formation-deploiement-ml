[project]
name = "diabetes-ml"
version = "0.1.0"
description = "Projet fil rouge de la formation : prédiction du risque de diabète, de l'entraînement au déploiement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cellule Info CEAM" }]

# Dépendances du cœur (entraînement et prédiction). Les autres sont en groupes
# pour construire des images Docker légères : api, app, mlops, dev.
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
]

[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]
app = [
    "streamlit>=1.38",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]
mlops = [
    "mlflow>=3.0",
    "dvc>=3.50",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
# `uv sync` sans option installe tout : confortable pour le développement.
default-groups = ["api", "app", "mlops", "dev"]

[project.scripts]
diabetes-prepare = "diabetes_ml.data:main"
diabetes-train = "diabetes_ml.train:main"
diabetes-evaluate = "diabetes_ml.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diabetes_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "app", "tests"]
extend-exclude = [".venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
