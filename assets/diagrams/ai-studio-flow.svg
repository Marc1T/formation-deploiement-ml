<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" class="dg dg-ai-studio-flow" role="img" aria-labelledby="dg-ai-studio-flow-t dg-ai-studio-flow-d">
<title id="dg-ai-studio-flow-t">De Google AI Studio à votre application</title>
<desc id="dg-ai-studio-flow-d">On prototype le prompt dans AI Studio, on crée une clé, on la range dans un secret, et le SDK l’utilise depuis l’application.</desc>

  <style>
    .dg-ai-studio-flow {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-ai-studio-flow {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-ai-studio-flow .bg { fill: var(--bg); }
    .dg-ai-studio-flow text { fill: var(--fg); }
    .dg-ai-studio-flow .muted { fill: var(--muted); }
    .dg-ai-studio-flow .label { fill: var(--nodefg); font-weight: 600; }
    .dg-ai-studio-flow .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-ai-studio-flow .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-ai-studio-flow .ghost .label, .dg-ai-studio-flow .ghost .sublabel { fill: var(--ghostfg); }
    .dg-ai-studio-flow .ghost .ic { color: var(--muted); }
    .dg-ai-studio-flow .ic { color: var(--nodefg); }
    .dg-ai-studio-flow .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-ai-studio-flow .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-ai-studio-flow .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-ai-studio-flow .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-ai-studio-flow .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-ai-studio-flow .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-ai-studio-flow .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-ai-studio-flow .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-ai-studio-flow .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-ai-studio-flow .edge.thin { stroke-width: 1.6; }
    .dg-ai-studio-flow .edge.dashed { stroke-dasharray: 6 6; }
    .dg-ai-studio-flow .edge.flow { stroke-dasharray: 9 8; animation: dg-ai-studio-flow-flow 1.1s linear infinite; }
    .dg-ai-studio-flow .edge.slow { animation-duration: 2.2s; }
    .dg-ai-studio-flow .edge.accent { stroke: var(--accent); }
    .dg-ai-studio-flow .edge.warn { stroke: var(--accent2); }
    .dg-ai-studio-flow .edge.ok { stroke: var(--ok); }
    .dg-ai-studio-flow .edge.err { stroke: var(--err); }
    .dg-ai-studio-flow .edge.data { stroke: var(--data); }
    .dg-ai-studio-flow .edge.ai { stroke: var(--ai); }
    .dg-ai-studio-flow .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-ai-studio-flow .arrow { fill: var(--muted); }
    .dg-ai-studio-flow .arrow.accent { fill: var(--accent); } .dg-ai-studio-flow .arrow.warn { fill: var(--accent2); }
    .dg-ai-studio-flow .arrow.ok { fill: var(--ok); } .dg-ai-studio-flow .arrow.err { fill: var(--err); }
    .dg-ai-studio-flow .arrow.data { fill: var(--data); } .dg-ai-studio-flow .arrow.ai { fill: var(--ai); }
    .dg-ai-studio-flow .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-ai-studio-flow .edge-label.fg { fill: var(--fg); }
    .dg-ai-studio-flow .edge-label-bg { fill: var(--bg); }
    .dg-ai-studio-flow .badge-done { fill: var(--ok); } .dg-ai-studio-flow .badge-err { fill: var(--err); } .dg-ai-studio-flow .badge-run { fill: var(--accent2); }
    .dg-ai-studio-flow .badge-ic { color: #fff; }
    .dg-ai-studio-flow .note { fill: var(--muted); font-size: 12px; }
    .dg-ai-studio-flow .fg { fill: var(--fg); }
    .dg-ai-studio-flow .strong { font-weight: 600; }
    .dg-ai-studio-flow .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-ai-studio-flow .small { font-size: 11px; }
    .dg-ai-studio-flow .pill { fill: var(--surface2); }
    .dg-ai-studio-flow .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-ai-studio-flow .pill.user { fill: var(--user); } .dg-ai-studio-flow .pill.infra { fill: var(--infra); }
    .dg-ai-studio-flow .pill.user .pill-text, .dg-ai-studio-flow .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-ai-studio-flow .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-ai-studio-flow-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-ai-studio-flow .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-ai-studio-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<marker id="dg-ai-studio-flow-arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow ai"/></marker>
<symbol id="dg-ai-studio-flow-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-ai-studio-flow-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-ai-studio-flow-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-ai-studio-flow-i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
<symbol id="dg-ai-studio-flow-i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M16 7l3 3M14 9l2 2"/></symbol>
<symbol id="dg-ai-studio-flow-i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="dg-ai-studio-flow-i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
<symbol id="dg-ai-studio-flow-i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
<symbol id="dg-ai-studio-flow-i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9H7Z"/></symbol>
</defs>
<rect class="bg" width="1000" height="280" rx="18"/>
<path class="edge flow" d="M190 122 C205.5 122, 205.5 122, 221 122" marker-end="url(#dg-ai-studio-flow-arrow)"/>
<rect class="edge-label-bg" x="183.75" y="66" width="46.5" height="16" rx="4"/>
<text class="edge-label " x="207" y="78" text-anchor="middle">copie</text>
<path class="edge flow" d="M385 122 C400.5 122, 400.5 122, 416 122" marker-end="url(#dg-ai-studio-flow-arrow)"/>
<rect class="edge-label-bg" x="330.45" y="66" width="143.1" height="16" rx="4"/>
<text class="edge-label " x="402" y="78" text-anchor="middle">jamais dans le code</text>
<path class="edge flow" d="M580 122 C595.5 122, 595.5 122, 611 122" marker-end="url(#dg-ai-studio-flow-arrow)"/>
<rect class="edge-label-bg" x="542.7" y="66" width="108.60000000000001" height="16" rx="4"/>
<text class="edge-label " x="597" y="78" text-anchor="middle">variable d’env</text>
<path class="edge flow" d="M775 122 C790.5 122, 790.5 122, 806 122" marker-end="url(#dg-ai-studio-flow-arrow)"/>
<rect class="edge-label-bg" x="765.3" y="66" width="53.400000000000006" height="16" rx="4"/>
<text class="edge-label " x="792" y="78" text-anchor="middle">import</text>
<path class="edge flow ai" d="M695 154 C695 175, 695 175, 695 196" marker-end="url(#dg-ai-studio-flow-arrow-ai)"/>
<rect class="edge-label-bg" x="709.15" y="168" width="101.7" height="16" rx="4"/>
<text class="edge-label " x="760" y="180" text-anchor="middle">requête + clé</text>
<path class="edge flow ai" d="M775 228 Q890 228 890 158" marker-end="url(#dg-ai-studio-flow-arrow-ai)"/>
<rect class="edge-label-bg" x="881.75" y="205" width="46.5" height="16" rx="4"/>
<text class="edge-label " x="905" y="217" text-anchor="middle">texte</text>
<g class="node " data-id="studio">
<rect class="box" fill="var(--ai)" x="30" y="90" width="160" height="64" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-sparkle" x="44" y="110" width="24" height="24"/>
<text class="label" x="78" y="120" font-size="13">Google AI Studio</text>
<text class="sublabel" x="78" y="134" font-size="10">tester le prompt</text>
</g>
<g class="node " data-id="key">
<rect class="box" fill="var(--ai)" x="225" y="90" width="160" height="64" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-key" x="239" y="110" width="24" height="24"/>
<text class="label" x="273" y="120" font-size="14">Clé API</text>
<text class="sublabel" x="273" y="135" font-size="11">Get API key</text>
</g>
<g class="node " data-id="secret">
<rect class="box" fill="var(--infra)" x="420" y="90" width="160" height="64" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-lock" x="434" y="110" width="24" height="24"/>
<text class="label" x="468" y="120" font-size="14">Secret</text>
<text class="sublabel" x="468" y="135" font-size="11">.env · Secrets · env</text>
</g>
<g class="node " data-id="sdk">
<rect class="box" fill="var(--code)" x="615" y="90" width="160" height="64" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-code" x="629" y="110" width="24" height="24"/>
<text class="label" x="663" y="120" font-size="14">google-genai</text>
<text class="sublabel" x="663" y="135" font-size="11">SDK Python</text>
</g>
<g class="node " data-id="app">
<rect class="box" fill="var(--user)" x="810" y="90" width="160" height="64" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-globe" x="824" y="110" width="24" height="24"/>
<text class="label" x="858" y="120" font-size="14">Votre app</text>
<text class="sublabel" x="858" y="135" font-size="11">Streamlit / FastAPI</text>
</g>
<g class="node " data-id="gemini">
<rect class="box" fill="var(--ai)" x="615" y="200" width="160" height="56" rx="12"/>
<use class="ic" href="#dg-ai-studio-flow-i-cloud" x="629" y="216" width="24" height="24"/>
<text class="label" x="663" y="226" font-size="14">Gemini API</text>
<text class="sublabel" x="663" y="241" font-size="11">gemini-flash-latest</text>
</g>
<text class="note" x="500" y="268" text-anchor="middle" font-size="12">La clé reste côté serveur. Le palier gratuit peut utiliser vos requêtes pour entraîner les modèles : pas de données sensibles.</text>
</svg>
