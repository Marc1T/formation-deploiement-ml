<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 270" width="1090" height="270" class="dg dg-gcp-cloud-run" role="img" aria-labelledby="dg-gcp-cloud-run-t dg-gcp-cloud-run-d">
<title id="dg-gcp-cloud-run-t">Déployer l’API sur Cloud Run</title>
<desc id="dg-gcp-cloud-run-d">Cloud Build construit l’image à partir du Dockerfile, Artifact Registry la stocke, Cloud Run la sert en HTTPS.</desc>

  <style>
    .dg-gcp-cloud-run {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-gcp-cloud-run {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-gcp-cloud-run .bg { fill: var(--bg); }
    .dg-gcp-cloud-run text { fill: var(--fg); }
    .dg-gcp-cloud-run .muted { fill: var(--muted); }
    .dg-gcp-cloud-run .label { fill: var(--nodefg); font-weight: 600; }
    .dg-gcp-cloud-run .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-gcp-cloud-run .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-gcp-cloud-run .ghost .label, .dg-gcp-cloud-run .ghost .sublabel { fill: var(--ghostfg); }
    .dg-gcp-cloud-run .ghost .ic { color: var(--muted); }
    .dg-gcp-cloud-run .ic { color: var(--nodefg); }
    .dg-gcp-cloud-run .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-gcp-cloud-run .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-gcp-cloud-run .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-gcp-cloud-run .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-gcp-cloud-run .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-gcp-cloud-run .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-gcp-cloud-run .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-gcp-cloud-run .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-gcp-cloud-run .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-gcp-cloud-run .edge.thin { stroke-width: 1.6; }
    .dg-gcp-cloud-run .edge.dashed { stroke-dasharray: 6 6; }
    .dg-gcp-cloud-run .edge.flow { stroke-dasharray: 9 8; animation: dg-gcp-cloud-run-flow 1.1s linear infinite; }
    .dg-gcp-cloud-run .edge.slow { animation-duration: 2.2s; }
    .dg-gcp-cloud-run .edge.accent { stroke: var(--accent); }
    .dg-gcp-cloud-run .edge.warn { stroke: var(--accent2); }
    .dg-gcp-cloud-run .edge.ok { stroke: var(--ok); }
    .dg-gcp-cloud-run .edge.err { stroke: var(--err); }
    .dg-gcp-cloud-run .edge.data { stroke: var(--data); }
    .dg-gcp-cloud-run .edge.ai { stroke: var(--ai); }
    .dg-gcp-cloud-run .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-gcp-cloud-run .arrow { fill: var(--muted); }
    .dg-gcp-cloud-run .arrow.accent { fill: var(--accent); } .dg-gcp-cloud-run .arrow.warn { fill: var(--accent2); }
    .dg-gcp-cloud-run .arrow.ok { fill: var(--ok); } .dg-gcp-cloud-run .arrow.err { fill: var(--err); }
    .dg-gcp-cloud-run .arrow.data { fill: var(--data); } .dg-gcp-cloud-run .arrow.ai { fill: var(--ai); }
    .dg-gcp-cloud-run .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-gcp-cloud-run .edge-label.fg { fill: var(--fg); }
    .dg-gcp-cloud-run .edge-label-bg { fill: var(--bg); }
    .dg-gcp-cloud-run .badge-done { fill: var(--ok); } .dg-gcp-cloud-run .badge-err { fill: var(--err); } .dg-gcp-cloud-run .badge-run { fill: var(--accent2); }
    .dg-gcp-cloud-run .badge-ic { color: #fff; }
    .dg-gcp-cloud-run .note { fill: var(--muted); font-size: 12px; }
    .dg-gcp-cloud-run .fg { fill: var(--fg); }
    .dg-gcp-cloud-run .strong { font-weight: 600; }
    .dg-gcp-cloud-run .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-gcp-cloud-run .small { font-size: 11px; }
    .dg-gcp-cloud-run .pill { fill: var(--surface2); }
    .dg-gcp-cloud-run .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-gcp-cloud-run .pill.user { fill: var(--user); } .dg-gcp-cloud-run .pill.infra { fill: var(--infra); }
    .dg-gcp-cloud-run .pill.user .pill-text, .dg-gcp-cloud-run .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-gcp-cloud-run .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-gcp-cloud-run-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-gcp-cloud-run .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-gcp-cloud-run-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
