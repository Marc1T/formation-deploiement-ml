<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" class="dg dg-git-vs-dvc" role="img" aria-labelledby="dg-git-vs-dvc-t dg-git-vs-dvc-d">
<title id="dg-git-vs-dvc-t">Git pour le code, DVC pour les données</title>
<desc id="dg-git-vs-dvc-d">Git stocke le code et un pointeur de deux lignes ; DVC synchronise le contenu réel avec un remote.</desc>

  <style>
    .dg-git-vs-dvc {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-git-vs-dvc {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-git-vs-dvc .bg { fill: var(--bg); }
    .dg-git-vs-dvc text { fill: var(--fg); }
    .dg-git-vs-dvc .muted { fill: var(--muted); }
    .dg-git-vs-dvc .label { fill: var(--nodefg); font-weight: 600; }
    .dg-git-vs-dvc .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-git-vs-dvc .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-git-vs-dvc .ghost .label, .dg-git-vs-dvc .ghost .sublabel { fill: var(--ghostfg); }
    .dg-git-vs-dvc .ghost .ic { color: var(--muted); }
    .dg-git-vs-dvc .ic { color: var(--nodefg); }
    .dg-git-vs-dvc .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-git-vs-dvc .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-git-vs-dvc .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-git-vs-dvc .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-git-vs-dvc .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-git-vs-dvc .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-git-vs-dvc .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-git-vs-dvc .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-git-vs-dvc .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-git-vs-dvc .edge.thin { stroke-width: 1.6; }
    .dg-git-vs-dvc .edge.dashed { stroke-dasharray: 6 6; }
    .dg-git-vs-dvc .edge.flow { stroke-dasharray: 9 8; animation: dg-git-vs-dvc-flow 1.1s linear infinite; }
    .dg-git-vs-dvc .edge.slow { animation-duration: 2.2s; }
    .dg-git-vs-dvc .edge.accent { stroke: var(--accent); }
    .dg-git-vs-dvc .edge.warn { stroke: var(--accent2); }
    .dg-git-vs-dvc .edge.ok { stroke: var(--ok); }
    .dg-git-vs-dvc .edge.err { stroke: var(--err); }
    .dg-git-vs-dvc .edge.data { stroke: var(--data); }
    .dg-git-vs-dvc .edge.ai { stroke: var(--ai); }
    .dg-git-vs-dvc .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-git-vs-dvc .arrow { fill: var(--muted); }
    .dg-git-vs-dvc .arrow.accent { fill: var(--accent); } .dg-git-vs-dvc .arrow.warn { fill: var(--accent2); }
    .dg-git-vs-dvc .arrow.ok { fill: var(--ok); } .dg-git-vs-dvc .arrow.err { fill: var(--err); }
    .dg-git-vs-dvc .arrow.data { fill: var(--data); } .dg-git-vs-dvc .arrow.ai { fill: var(--ai); }
    .dg-git-vs-dvc .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-git-vs-dvc .edge-label.fg { fill: var(--fg); }
    .dg-git-vs-dvc .edge-label-bg { fill: var(--bg); }
    .dg-git-vs-dvc .badge-done { fill: var(--ok); } .dg-git-vs-dvc .badge-err { fill: var(--err); } .dg-git-vs-dvc .badge-run { fill: var(--accent2); }
    .dg-git-vs-dvc .badge-ic { color: #fff; }
    .dg-git-vs-dvc .note { fill: var(--muted); font-size: 12px; }
    .dg-git-vs-dvc .fg { fill: var(--fg); }
    .dg-git-vs-dvc .strong { font-weight: 600; }
    .dg-git-vs-dvc .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-git-vs-dvc .small { font-size: 11px; }
    .dg-git-vs-dvc .pill { fill: var(--surface2); }
    .dg-git-vs-dvc .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-git-vs-dvc .pill.user { fill: var(--user); } .dg-git-vs-dvc .pill.infra { fill: var(--infra); }
    .dg-git-vs-dvc .pill.user .pill-text, .dg-git-vs-dvc .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-git-vs-dvc .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-git-vs-dvc-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-git-vs-dvc .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-git-vs-dvc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<marker id="dg-git-vs-dvc-arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow data"/></marker>
<symbol id="dg-git-vs-dvc-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-git-vs-dvc-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-git-vs-dvc-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-git-vs-dvc-i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
<symbol id="dg-git-vs-dvc-i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6Z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="dg-git-vs-dvc-i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11V3Z"/><path d="M7.5 7.5h.01"/></symbol>
<symbol id="dg-git-vs-dvc-i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="dg-git-vs-dvc-i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10M8 5l8 4"/></symbol>
<symbol id="dg-git-vs-dvc-i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9H7Z"/></symbol>
</defs>
<rect class="bg" width="1000" height="330" rx="18"/>
<g class="grp">
<rect class="group  tint-code" x="30" y="40" width="400" height="250" rx="16"/>
<text class="group-title" x="44" y="60">Dépôt Git (GitHub) · code et pointeurs</text>
</g>
<g class="grp">
<rect class="group  tint-data" x="570" y="40" width="400" height="250" rx="16"/>
<text class="group-title" x="584" y="60">Remote DVC · données et artefacts</text>
</g>
<path class="edge flow data" d="M410 235 L586 105" marker-end="url(#dg-git-vs-dvc-arrow-data)"/>
<rect class="edge-label-bg" x="428.45" y="140" width="143.1" height="16" rx="4"/>
<text class="edge-label " x="500" y="152" text-anchor="middle">dvc push ↔ dvc pull</text>
<g class="node " data-id="g1">
<rect class="box" fill="var(--code)" x="50" y="80" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-code" x="64" y="96" width="18" height="18"/>
<text class="label" x="92" y="103" font-size="14">Code : src/, api/, app/</text>
<text class="sublabel" x="92" y="118" font-size="11">quelques Ko, lisible en diff</text>
</g>
<g class="node " data-id="g2">
<rect class="box" fill="var(--code)" x="50" y="145" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-file" x="64" y="161" width="18" height="18"/>
<text class="label" x="92" y="168" font-size="14">params.yaml · dvc.yaml · dvc.lock</text>
<text class="sublabel" x="92" y="183" font-size="11">le pipeline et ses paramètres</text>
</g>
<g class="node " data-id="g3">
<rect class="box" fill="var(--code)" x="50" y="210" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-tag" x="64" y="226" width="18" height="18"/>
<text class="label" x="92" y="233" font-size="14">data/raw/diabetes.csv.dvc</text>
<text class="sublabel" x="92" y="248" font-size="11">pointeur : md5 + taille (2 lignes)</text>
</g>
<g class="node " data-id="r1">
<rect class="box" fill="var(--data)" x="590" y="80" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-database" x="604" y="96" width="18" height="18"/>
<text class="label" x="632" y="103" font-size="14">data/raw/diabetes.csv</text>
<text class="sublabel" x="632" y="118" font-size="11">le contenu réel (Mo ou Go)</text>
</g>
<g class="node " data-id="r2">
<rect class="box" fill="var(--data)" x="590" y="145" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-package" x="604" y="161" width="18" height="18"/>
<text class="label" x="632" y="168" font-size="14">models/model.joblib</text>
<text class="sublabel" x="632" y="183" font-size="11">artefact d’entraînement</text>
</g>
<g class="node " data-id="r3">
<rect class="box" fill="var(--data)" x="590" y="210" width="360" height="50" rx="12"/>
<use class="ic" href="#dg-git-vs-dvc-i-cloud" x="604" y="226" width="18" height="18"/>
<text class="label" x="632" y="233" font-size="14">Dossier partagé · Azure Blob · GCS · S3</text>
<text class="sublabel" x="632" y="248" font-size="11">configuré par dvc remote add</text>
</g>
<text class="note" x="500" y="316" text-anchor="middle" font-size="12">Git ne voit que le pointeur (hash) ; DVC retrouve le contenu correspondant dans le remote.</text>
</svg>
