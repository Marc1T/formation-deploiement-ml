<path class="edge flow" d="M962 152 C1005 152, 1005 152, 1048 152" marker-end="url(#dg-chaine-complete-arrow)"/>
<rect class="edge-label-bg" x="976.85" y="96" width="60.300000000000004" height="16" rx="4"/>
<text class="edge-label " x="1007" y="108" text-anchor="middle">déploie</text>
