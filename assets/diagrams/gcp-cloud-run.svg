<rect class="edge-label-bg" x="652.35" y="72" width="129.3" height="16" rx="4"/>
<text class="edge-label " x="717" y="84" text-anchor="middle">gcloud run deploy</text>
<path class="edge flow" d="M880 128 C890.5 128, 890.5 128, 901 128" marker-end="url(#dg-gcp-cloud-run-arrow)"/>
<rect class="edge-label-bg" x="858.4" y="72" width="67.2" height="16" rx="4"/>
<text class="edge-label " x="892" y="84" text-anchor="middle">…run.app</text>
