<text class="note small" x="105" y="182" text-anchor="middle" font-size="12">Dockerfile</text>
<text class="note small" x="280" y="182" text-anchor="middle" font-size="12">depuis votre poste</text>
<text class="note small" x="455" y="182" text-anchor="middle" font-size="12">docker build dans le cloud</text>
<text class="note small" x="630" y="182" text-anchor="middle" font-size="12">image api:latest</text>
<text class="note small" x="805" y="182" text-anchor="middle" font-size="12">0 → N instances</text>
<text class="note small" x="980" y="182" text-anchor="middle" font-size="12">public ou authentifié</text>
<text class="note" x="545" y="252" text-anchor="middle" font-size="12">Cloud Run facture à la requête et descend à zéro instance : adapté à une API de démonstration.</text>
</svg>
