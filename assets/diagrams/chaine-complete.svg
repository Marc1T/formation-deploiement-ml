<g><rect class="pill " x="1052" y="206" width="103.2" height="22" rx="11"/><text class="pill-text" x="1103.6" y="221" text-anchor="middle">Azure · GCP</text></g>
<text class="note" x="620" y="280" text-anchor="middle" font-size="12">Chaque flèche est un point de passage que la formation outille : versionner, tester, emballer, déployer.</text>
