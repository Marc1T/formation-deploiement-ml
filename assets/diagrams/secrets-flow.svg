<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" class="dg dg-secrets-flow" role="img" aria-labelledby="dg-secrets-flow-t dg-secrets-flow-d">
<title id="dg-secrets-flow-t">Les secrets : une seule façon de lire, plusieurs façons de fournir</title>
<desc id="dg-secrets-flow-d">L’application lit ses secrets dans les variables d’environnement ; chaque plateforme a son moyen de les injecter.</desc>

  <style>
    .dg-secrets-flow {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-secrets-flow {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-secrets-flow .bg { fill: var(--bg); }
    .dg-secrets-flow text { fill: var(--fg); }
    .dg-secrets-flow .muted { fill: var(--muted); }
    .dg-secrets-flow .label { fill: var(--nodefg); font-weight: 600; }
    .dg-secrets-flow .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-secrets-flow .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-secrets-flow .ghost .label, .dg-secrets-flow .ghost .sublabel { fill: var(--ghostfg); }
    .dg-secrets-flow .ghost .ic { color: var(--muted); }
    .dg-secrets-flow .ic { color: var(--nodefg); }
    .dg-secrets-flow .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-secrets-flow .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-secrets-flow .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-secrets-flow .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-secrets-flow .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-secrets-flow .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-secrets-flow .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-secrets-flow .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-secrets-flow .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-secrets-flow .edge.thin { stroke-width: 1.6; }
    .dg-secrets-flow .edge.dashed { stroke-dasharray: 6 6; }
    .dg-secrets-flow .edge.flow { stroke-dasharray: 9 8; animation: dg-secrets-flow-flow 1.1s linear infinite; }
    .dg-secrets-flow .edge.slow { animation-duration: 2.2s; }
    .dg-secrets-flow .edge.accent { stroke: var(--accent); }
    .dg-secrets-flow .edge.warn { stroke: var(--accent2); }
    .dg-secrets-flow .edge.ok { stroke: var(--ok); }
    .dg-secrets-flow .edge.err { stroke: var(--err); }
    .dg-secrets-flow .edge.data { stroke: var(--data); }
    .dg-secrets-flow .edge.ai { stroke: var(--ai); }
    .dg-secrets-flow .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-secrets-flow .arrow { fill: var(--muted); }
    .dg-secrets-flow .arrow.accent { fill: var(--accent); } .dg-secrets-flow .arrow.warn { fill: var(--accent2); }
    .dg-secrets-flow .arrow.ok { fill: var(--ok); } .dg-secrets-flow .arrow.err { fill: var(--err); }
    .dg-secrets-flow .arrow.data { fill: var(--data); } .dg-secrets-flow .arrow.ai { fill: var(--ai); }
    .dg-secrets-flow .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-secrets-flow .edge-label.fg { fill: var(--fg); }
    .dg-secrets-flow .edge-label-bg { fill: var(--bg); }
    .dg-secrets-flow .badge-done { fill: var(--ok); } .dg-secrets-flow .badge-err { fill: var(--err); } .dg-secrets-flow .badge-run { fill: var(--accent2); }
    .dg-secrets-flow .badge-ic { color: #fff; }
    .dg-secrets-flow .note { fill: var(--muted); font-size: 12px; }
    .dg-secrets-flow .fg { fill: var(--fg); }
    .dg-secrets-flow .strong { font-weight: 600; }
    .dg-secrets-flow .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-secrets-flow .small { font-size: 11px; }
    .dg-secrets-flow .pill { fill: var(--surface2); }
    .dg-secrets-flow .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-secrets-flow .pill.user { fill: var(--user); } .dg-secrets-flow .pill.infra { fill: var(--infra); }
    .dg-secrets-flow .pill.user .pill-text, .dg-secrets-flow .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-secrets-flow .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-secrets-flow-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-secrets-flow .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-secrets-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<symbol id="dg-secrets-flow-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-secrets-flow-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-secrets-flow-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-secrets-flow-i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
<symbol id="dg-secrets-flow-i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6Z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="dg-secrets-flow-i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="dg-secrets-flow-i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
</defs>
<rect class="bg" width="1000" height="310" rx="18"/>
<path class="edge flow" d="M300 58 C348 58, 348 144, 396 144" marker-end="url(#dg-secrets-flow-arrow)"/>
<rect class="edge-label-bg" x="237.75" y="86" width="184.5" height="16" rx="4"/>
<text class="edge-label " x="330" y="98" text-anchor="middle">variables d’environnement</text>
<path class="edge flow" d="M300 238 C348 238, 348 144, 396 144" marker-end="url(#dg-secrets-flow-arrow)"/>
<path class="edge flow" d="M700 58 C652 58, 652 144, 604 144" marker-end="url(#dg-secrets-flow-arrow)"/>
<path class="edge flow" d="M700 238 C652 238, 652 144, 604 144" marker-end="url(#dg-secrets-flow-arrow)"/>
<g class="node " data-id="app">
<rect class="box" fill="var(--code)" x="400" y="112" width="200" height="64" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-globe" x="414" y="132" width="24" height="24"/>
<text class="label" x="448" y="142" font-size="13">Application</text>
<text class="sublabel" x="448" y="156" font-size="10">os.environ[&quot;GEMINI_API_KEY&quot;]</text>
</g>
<g class="node " data-id="s1">
<rect class="box" fill="var(--infra)" x="30" y="30" width="270" height="56" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-file" x="44" y="46" width="24" height="24"/>
<text class="label" x="78" y="56" font-size="14">En local</text>
<text class="sublabel" x="78" y="71" font-size="11">.env (ignoré par Git)</text>
</g>
<g class="node " data-id="s2">
<rect class="box" fill="var(--infra)" x="30" y="210" width="270" height="56" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-lock" x="44" y="226" width="24" height="24"/>
<text class="label" x="78" y="236" font-size="14">Streamlit Cloud</text>
<text class="sublabel" x="78" y="251" font-size="11">Secrets (TOML) dans l’interface</text>
</g>
<g class="node " data-id="s3">
<rect class="box" fill="var(--infra)" x="700" y="30" width="270" height="56" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-lock" x="714" y="46" width="24" height="24"/>
<text class="label" x="748" y="56" font-size="13">Azure Container Apps</text>
<text class="sublabel" x="748" y="70" font-size="10">secrets + variables d’env</text>
</g>
<g class="node " data-id="s4">
<rect class="box" fill="var(--infra)" x="700" y="210" width="270" height="56" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-lock" x="714" y="226" width="24" height="24"/>
<text class="label" x="748" y="236" font-size="14">GitHub Actions</text>
<text class="sublabel" x="748" y="251" font-size="11">Secrets du dépôt, pour la CI</text>
</g>
<g class="node ghost" data-id="bad">
<rect class="box"  x="400" y="232" width="200" height="50" rx="12"/>
<use class="ic" href="#dg-secrets-flow-i-code" x="414" y="248" width="18" height="18"/>
<text class="label" x="442" y="255" font-size="13">clé écrite dans le code</text>
<text class="sublabel" x="442" y="269" font-size="10">finit dans Git et dans l’image</text>
<line class="cross" x1="410" y1="240" x2="590" y2="274"/>
<line class="cross" x1="590" y1="240" x2="410" y2="274"/>
</g>
<text class="note" x="500" y="300" text-anchor="middle" font-size="12">Le code ne change pas d’une plateforme à l’autre : seule la façon de fournir la configuration change.</text>
</svg>
