<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" class="dg dg-architecture-3-tiers" role="img" aria-labelledby="dg-architecture-3-tiers-t dg-architecture-3-tiers-d">
<title id="dg-architecture-3-tiers-t">Architecture : navigateur, Streamlit, FastAPI, modèle</title>
<desc id="dg-architecture-3-tiers-d">Le navigateur parle à Streamlit, qui appelle l’API en JSON ; l’API charge le modèle et renvoie la prédiction.</desc>

  <style>
    .dg-architecture-3-tiers {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-architecture-3-tiers {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-architecture-3-tiers .bg { fill: var(--bg); }
    .dg-architecture-3-tiers text { fill: var(--fg); }
    .dg-architecture-3-tiers .muted { fill: var(--muted); }
    .dg-architecture-3-tiers .label { fill: var(--nodefg); font-weight: 600; }
    .dg-architecture-3-tiers .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-architecture-3-tiers .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-architecture-3-tiers .ghost .label, .dg-architecture-3-tiers .ghost .sublabel { fill: var(--ghostfg); }
    .dg-architecture-3-tiers .ghost .ic { color: var(--muted); }
    .dg-architecture-3-tiers .ic { color: var(--nodefg); }
    .dg-architecture-3-tiers .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-architecture-3-tiers .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-architecture-3-tiers .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-architecture-3-tiers .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-architecture-3-tiers .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-architecture-3-tiers .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-architecture-3-tiers .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-architecture-3-tiers .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-architecture-3-tiers .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-architecture-3-tiers .edge.thin { stroke-width: 1.6; }
    .dg-architecture-3-tiers .edge.dashed { stroke-dasharray: 6 6; }
    .dg-architecture-3-tiers .edge.flow { stroke-dasharray: 9 8; animation: dg-architecture-3-tiers-flow 1.1s linear infinite; }
    .dg-architecture-3-tiers .edge.slow { animation-duration: 2.2s; }
    .dg-architecture-3-tiers .edge.accent { stroke: var(--accent); }
    .dg-architecture-3-tiers .edge.warn { stroke: var(--accent2); }
    .dg-architecture-3-tiers .edge.ok { stroke: var(--ok); }
    .dg-architecture-3-tiers .edge.err { stroke: var(--err); }
    .dg-architecture-3-tiers .edge.data { stroke: var(--data); }
    .dg-architecture-3-tiers .edge.ai { stroke: var(--ai); }
    .dg-architecture-3-tiers .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-architecture-3-tiers .arrow { fill: var(--muted); }
    .dg-architecture-3-tiers .arrow.accent { fill: var(--accent); } .dg-architecture-3-tiers .arrow.warn { fill: var(--accent2); }
    .dg-architecture-3-tiers .arrow.ok { fill: var(--ok); } .dg-architecture-3-tiers .arrow.err { fill: var(--err); }
    .dg-architecture-3-tiers .arrow.data { fill: var(--data); } .dg-architecture-3-tiers .arrow.ai { fill: var(--ai); }
    .dg-architecture-3-tiers .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-architecture-3-tiers .edge-label.fg { fill: var(--fg); }
    .dg-architecture-3-tiers .edge-label-bg { fill: var(--bg); }
    .dg-architecture-3-tiers .badge-done { fill: var(--ok); } .dg-architecture-3-tiers .badge-err { fill: var(--err); } .dg-architecture-3-tiers .badge-run { fill: var(--accent2); }
    .dg-architecture-3-tiers .badge-ic { color: #fff; }
    .dg-architecture-3-tiers .note { fill: var(--muted); font-size: 12px; }
    .dg-architecture-3-tiers .fg { fill: var(--fg); }
    .dg-architecture-3-tiers .strong { font-weight: 600; }
    .dg-architecture-3-tiers .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-architecture-3-tiers .small { font-size: 11px; }
    .dg-architecture-3-tiers .pill { fill: var(--surface2); }
    .dg-architecture-3-tiers .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-architecture-3-tiers .pill.user { fill: var(--user); } .dg-architecture-3-tiers .pill.infra { fill: var(--infra); }
    .dg-architecture-3-tiers .pill.user .pill-text, .dg-architecture-3-tiers .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-architecture-3-tiers .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-architecture-3-tiers-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-architecture-3-tiers .edge.flow { animation: none; } }
  </style>
<defs>
