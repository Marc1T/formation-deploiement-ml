<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" class="dg dg-checklist-prod" role="img" aria-labelledby="dg-checklist-prod-t dg-checklist-prod-d">
<title id="dg-checklist-prod-t">Avant de déployer : huit vérifications</title>
<desc id="dg-checklist-prod-d">Les points à cocher entre un projet qui marche sur votre machine et une application en production.</desc>

  <style>
    .dg-checklist-prod {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-checklist-prod {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-checklist-prod .bg { fill: var(--bg); }
    .dg-checklist-prod text { fill: var(--fg); }
    .dg-checklist-prod .muted { fill: var(--muted); }
    .dg-checklist-prod .label { fill: var(--nodefg); font-weight: 600; }
    .dg-checklist-prod .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-checklist-prod .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-checklist-prod .ghost .label, .dg-checklist-prod .ghost .sublabel { fill: var(--ghostfg); }
    .dg-checklist-prod .ghost .ic { color: var(--muted); }
    .dg-checklist-prod .ic { color: var(--nodefg); }
    .dg-checklist-prod .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-checklist-prod .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-checklist-prod .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-checklist-prod .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-checklist-prod .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-checklist-prod .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-checklist-prod .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-checklist-prod .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-checklist-prod .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-checklist-prod .edge.thin { stroke-width: 1.6; }
    .dg-checklist-prod .edge.dashed { stroke-dasharray: 6 6; }
    .dg-checklist-prod .edge.flow { stroke-dasharray: 9 8; animation: dg-checklist-prod-flow 1.1s linear infinite; }
    .dg-checklist-prod .edge.slow { animation-duration: 2.2s; }
    .dg-checklist-prod .edge.accent { stroke: var(--accent); }
    .dg-checklist-prod .edge.warn { stroke: var(--accent2); }
    .dg-checklist-prod .edge.ok { stroke: var(--ok); }
    .dg-checklist-prod .edge.err { stroke: var(--err); }
    .dg-checklist-prod .edge.data { stroke: var(--data); }
    .dg-checklist-prod .edge.ai { stroke: var(--ai); }
    .dg-checklist-prod .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-checklist-prod .arrow { fill: var(--muted); }
    .dg-checklist-prod .arrow.accent { fill: var(--accent); } .dg-checklist-prod .arrow.warn { fill: var(--accent2); }
    .dg-checklist-prod .arrow.ok { fill: var(--ok); } .dg-checklist-prod .arrow.err { fill: var(--err); }
    .dg-checklist-prod .arrow.data { fill: var(--data); } .dg-checklist-prod .arrow.ai { fill: var(--ai); }
    .dg-checklist-prod .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-checklist-prod .edge-label.fg { fill: var(--fg); }
    .dg-checklist-prod .edge-label-bg { fill: var(--bg); }
    .dg-checklist-prod .badge-done { fill: var(--ok); } .dg-checklist-prod .badge-err { fill: var(--err); } .dg-checklist-prod .badge-run { fill: var(--accent2); }
    .dg-checklist-prod .badge-ic { color: #fff; }
    .dg-checklist-prod .note { fill: var(--muted); font-size: 12px; }
    .dg-checklist-prod .fg { fill: var(--fg); }
    .dg-checklist-prod .strong { font-weight: 600; }
    .dg-checklist-prod .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-checklist-prod .small { font-size: 11px; }
    .dg-checklist-prod .pill { fill: var(--surface2); }
    .dg-checklist-prod .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-checklist-prod .pill.user { fill: var(--user); } .dg-checklist-prod .pill.infra { fill: var(--infra); }
    .dg-checklist-prod .pill.user .pill-text, .dg-checklist-prod .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-checklist-prod .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-checklist-prod-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-checklist-prod .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-checklist-prod-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<marker id="dg-checklist-prod-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow accent"/></marker>
<symbol id="dg-checklist-prod-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-checklist-prod-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-checklist-prod-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-checklist-prod-i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
<symbol id="dg-checklist-prod-i-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3c3 0 7 1 7 7-3 3-6 6-9 7l-4-4c1-3 3-7 6-10Z"/><path d="M8 13l-4 1 3-5M11 16l-1 4 5-3"/><circle cx="15" cy="9" r="1.5"/></symbol>
<symbol id="dg-checklist-prod-i-branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="8" r="2.2"/><path d="M6 7.2v9.6M18 10.2c0 4-4 5-8 5.5"/></symbol>
<symbol id="dg-checklist-prod-i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10M8 5l8 4"/></symbol>
<symbol id="dg-checklist-prod-i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="dg-checklist-prod-i-flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></symbol>
<symbol id="dg-checklist-prod-i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5M3 17l9 5 9-5"/></symbol>
<symbol id="dg-checklist-prod-i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M16 7l3 3M14 9l2 2"/></symbol>
<symbol id="dg-checklist-prod-i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="dg-checklist-prod-i-coins" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M15.5 7.5A6 6 0 1 1 7.5 15.5"/></symbol>
</defs>
<rect class="bg" width="1040" height="330" rx="18"/>
<g class="grp">
<rect class="group  tint-infra" x="250" y="30" width="520" height="270" rx="16"/>
<text class="group-title" x="264" y="50">Avant de déployer · 8 vérifications</text>
</g>
<path class="edge flow accent" d="M200 165 L246 165" marker-end="url(#dg-checklist-prod-arrow-accent)"/>
<path class="edge flow accent" d="M770 165 L816 165" marker-end="url(#dg-checklist-prod-arrow-accent)"/>
<g class="node " data-id="proj">
<rect class="box" fill="var(--user)" x="30" y="135" width="170" height="60" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-user" x="44" y="153" width="24" height="24"/>
<text class="label" x="78" y="163" font-size="14">Votre projet</text>
<text class="sublabel" x="78" y="178" font-size="11">ça marche chez moi</text>
</g>
<g class="node " data-id="prod">
<rect class="box" fill="var(--infra)" x="820" y="135" width="190" height="60" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-rocket" x="834" y="153" width="24" height="24"/>
<text class="label" x="868" y="163" font-size="14">Production</text>
<text class="sublabel" x="868" y="178" font-size="11">ça marche pour tous</text>
</g>
<g class="node " data-id="c1">
<rect class="box" fill="var(--code)" x="270" y="70" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-branch" x="284" y="85" width="18" height="18"/>
<text class="label" x="312" y="98.33333333333333" font-size="13">Code versionné (Git)</text>
</g>
<g class="node " data-id="c2">
<rect class="box" fill="var(--code)" x="520" y="70" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-package" x="534" y="85" width="18" height="18"/>
<text class="label" x="562" y="98.33333333333333" font-size="13">Dépendances figées (uv.lock)</text>
</g>
<g class="node " data-id="c3">
<rect class="box" fill="var(--data)" x="270" y="130" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-database" x="284" y="145" width="18" height="18"/>
<text class="label" x="312" y="158.33333333333334" font-size="13">Données et modèle versionnés</text>
</g>
<g class="node " data-id="c4">
<rect class="box" fill="var(--code)" x="520" y="130" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-flask" x="534" y="145" width="18" height="18"/>
<text class="label" x="562" y="158.33333333333334" font-size="13">Tests automatisés</text>
</g>
<g class="node " data-id="c5">
<rect class="box" fill="var(--infra)" x="270" y="190" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-layers" x="284" y="205" width="18" height="18"/>
<text class="label" x="312" y="218.33333333333334" font-size="13">Image Docker reproductible</text>
</g>
<g class="node " data-id="c6">
<rect class="box" fill="var(--infra)" x="520" y="190" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-key" x="534" y="205" width="18" height="18"/>
<text class="label" x="562" y="218.33333333333334" font-size="13">Secrets hors du code</text>
</g>
<g class="node " data-id="c7">
<rect class="box" fill="var(--infra)" x="270" y="250" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-eye" x="284" y="265" width="18" height="18"/>
<text class="label" x="312" y="278.3333333333333" font-size="13">/health, journaux, alertes</text>
</g>
<g class="node " data-id="c8">
<rect class="box" fill="var(--infra)" x="520" y="250" width="240" height="48" rx="12"/>
<use class="ic" href="#dg-checklist-prod-i-coins" x="534" y="265" width="18" height="18"/>
<text class="label" x="562" y="278.3333333333333" font-size="13">Coûts : scale-to-zero, nettoyage</text>
</g>
<text class="note" x="520" y="322" text-anchor="middle" font-size="12">Les séances 1, 2 et 3 couvrent respectivement les lignes 1-2, 3-5 et 6-8.</text>
</svg>
