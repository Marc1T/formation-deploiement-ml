<path class="edge flow" d="M355 128 C365.5 128, 365.5 128, 376 128" marker-end="url(#dg-gcp-cloud-run-arrow)"/>
<rect class="edge-label-bg" x="309.25" y="72" width="115.5" height="16" rx="4"/>
