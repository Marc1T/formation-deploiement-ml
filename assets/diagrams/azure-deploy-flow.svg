<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" class="dg dg-azure-deploy-flow" role="img" aria-labelledby="dg-azure-deploy-flow-t dg-azure-deploy-flow-d">
<title id="dg-azure-deploy-flow-t">Déployer l’API sur Azure Container Apps</title>
<desc id="dg-azure-deploy-flow-d">L’image publiée par la CI (ou construite dans ACR) est déployée dans une Container App exposée en HTTPS.</desc>

  <style>
    .dg-azure-deploy-flow {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-azure-deploy-flow {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-azure-deploy-flow .bg { fill: var(--bg); }
    .dg-azure-deploy-flow text { fill: var(--fg); }
    .dg-azure-deploy-flow .muted { fill: var(--muted); }
    .dg-azure-deploy-flow .label { fill: var(--nodefg); font-weight: 600; }
    .dg-azure-deploy-flow .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-azure-deploy-flow .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-azure-deploy-flow .ghost .label, .dg-azure-deploy-flow .ghost .sublabel { fill: var(--ghostfg); }
    .dg-azure-deploy-flow .ghost .ic { color: var(--muted); }
    .dg-azure-deploy-flow .ic { color: var(--nodefg); }
    .dg-azure-deploy-flow .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-azure-deploy-flow .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-azure-deploy-flow .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-azure-deploy-flow .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-azure-deploy-flow .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-azure-deploy-flow .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-azure-deploy-flow .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-azure-deploy-flow .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-azure-deploy-flow .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-azure-deploy-flow .edge.thin { stroke-width: 1.6; }
    .dg-azure-deploy-flow .edge.dashed { stroke-dasharray: 6 6; }
    .dg-azure-deploy-flow .edge.flow { stroke-dasharray: 9 8; animation: dg-azure-deploy-flow-flow 1.1s linear infinite; }
    .dg-azure-deploy-flow .edge.slow { animation-duration: 2.2s; }
    .dg-azure-deploy-flow .edge.accent { stroke: var(--accent); }
    .dg-azure-deploy-flow .edge.warn { stroke: var(--accent2); }
    .dg-azure-deploy-flow .edge.ok { stroke: var(--ok); }
    .dg-azure-deploy-flow .edge.err { stroke: var(--err); }
    .dg-azure-deploy-flow .edge.data { stroke: var(--data); }
    .dg-azure-deploy-flow .edge.ai { stroke: var(--ai); }
    .dg-azure-deploy-flow .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-azure-deploy-flow .arrow { fill: var(--muted); }
    .dg-azure-deploy-flow .arrow.accent { fill: var(--accent); } .dg-azure-deploy-flow .arrow.warn { fill: var(--accent2); }
    .dg-azure-deploy-flow .arrow.ok { fill: var(--ok); } .dg-azure-deploy-flow .arrow.err { fill: var(--err); }
    .dg-azure-deploy-flow .arrow.data { fill: var(--data); } .dg-azure-deploy-flow .arrow.ai { fill: var(--ai); }
    .dg-azure-deploy-flow .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-azure-deploy-flow .edge-label.fg { fill: var(--fg); }
    .dg-azure-deploy-flow .edge-label-bg { fill: var(--bg); }
    .dg-azure-deploy-flow .badge-done { fill: var(--ok); } .dg-azure-deploy-flow .badge-err { fill: var(--err); } .dg-azure-deploy-flow .badge-run { fill: var(--accent2); }
    .dg-azure-deploy-flow .badge-ic { color: #fff; }
    .dg-azure-deploy-flow .note { fill: var(--muted); font-size: 12px; }
    .dg-azure-deploy-flow .fg { fill: var(--fg); }
    .dg-azure-deploy-flow .strong { font-weight: 600; }
    .dg-azure-deploy-flow .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-azure-deploy-flow .small { font-size: 11px; }
    .dg-azure-deploy-flow .pill { fill: var(--surface2); }
    .dg-azure-deploy-flow .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-azure-deploy-flow .pill.user { fill: var(--user); } .dg-azure-deploy-flow .pill.infra { fill: var(--infra); }
    .dg-azure-deploy-flow .pill.user .pill-text, .dg-azure-deploy-flow .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-azure-deploy-flow .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-azure-deploy-flow-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-azure-deploy-flow .edge.flow { animation: none; } }
  </style>
