# Environnement complet en une commande :  docker compose up --build
#   API FastAPI      -> http://localhost:8000/docs
#   App Streamlit    -> http://localhost:8501
#   Serveur MLflow   -> http://localhost:5000   (MLFLOW_TRACKING_URI=http://localhost:5000 pour y envoyer vos runs)
#
# Prérequis : le modèle existe (uv run dvc repro) ; il est copié dans les images.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: diabetes-api:local
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/model.joblib
      THRESHOLD: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: diabetes-app:local
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000          # nom du service = nom DNS dans le réseau Compose
    env_file:
      - path: .env                      # GEMINI_API_KEY, etc. (facultatif)
        required: false
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data:
