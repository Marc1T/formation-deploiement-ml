<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" class="dg dg-mlflow-cycle" role="img" aria-labelledby="dg-mlflow-cycle-t dg-mlflow-cycle-d">
<title id="dg-mlflow-cycle-t">MLflow : tracer, comparer, enregistrer, servir</title>
<desc id="dg-mlflow-cycle-d">Le script d’entraînement envoie chaque exécution au tracking ; la meilleure est enregistrée dans le registre puis servie.</desc>

  <style>
    .dg-mlflow-cycle {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-mlflow-cycle {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-mlflow-cycle .bg { fill: var(--bg); }
    .dg-mlflow-cycle text { fill: var(--fg); }
    .dg-mlflow-cycle .muted { fill: var(--muted); }
    .dg-mlflow-cycle .label { fill: var(--nodefg); font-weight: 600; }
    .dg-mlflow-cycle .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-mlflow-cycle .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-mlflow-cycle .ghost .label, .dg-mlflow-cycle .ghost .sublabel { fill: var(--ghostfg); }
    .dg-mlflow-cycle .ghost .ic { color: var(--muted); }
    .dg-mlflow-cycle .ic { color: var(--nodefg); }
    .dg-mlflow-cycle .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-mlflow-cycle .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-mlflow-cycle .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-mlflow-cycle .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-mlflow-cycle .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-mlflow-cycle .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-mlflow-cycle .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-mlflow-cycle .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-mlflow-cycle .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-mlflow-cycle .edge.thin { stroke-width: 1.6; }
    .dg-mlflow-cycle .edge.dashed { stroke-dasharray: 6 6; }
    .dg-mlflow-cycle .edge.flow { stroke-dasharray: 9 8; animation: dg-mlflow-cycle-flow 1.1s linear infinite; }
    .dg-mlflow-cycle .edge.slow { animation-duration: 2.2s; }
    .dg-mlflow-cycle .edge.accent { stroke: var(--accent); }
    .dg-mlflow-cycle .edge.warn { stroke: var(--accent2); }
    .dg-mlflow-cycle .edge.ok { stroke: var(--ok); }
    .dg-mlflow-cycle .edge.err { stroke: var(--err); }
    .dg-mlflow-cycle .edge.data { stroke: var(--data); }
    .dg-mlflow-cycle .edge.ai { stroke: var(--ai); }
    .dg-mlflow-cycle .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-mlflow-cycle .arrow { fill: var(--muted); }
    .dg-mlflow-cycle .arrow.accent { fill: var(--accent); } .dg-mlflow-cycle .arrow.warn { fill: var(--accent2); }
    .dg-mlflow-cycle .arrow.ok { fill: var(--ok); } .dg-mlflow-cycle .arrow.err { fill: var(--err); }
    .dg-mlflow-cycle .arrow.data { fill: var(--data); } .dg-mlflow-cycle .arrow.ai { fill: var(--ai); }
    .dg-mlflow-cycle .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-mlflow-cycle .edge-label.fg { fill: var(--fg); }
    .dg-mlflow-cycle .edge-label-bg { fill: var(--bg); }
    .dg-mlflow-cycle .badge-done { fill: var(--ok); } .dg-mlflow-cycle .badge-err { fill: var(--err); } .dg-mlflow-cycle .badge-run { fill: var(--accent2); }
    .dg-mlflow-cycle .badge-ic { color: #fff; }
    .dg-mlflow-cycle .note { fill: var(--muted); font-size: 12px; }
    .dg-mlflow-cycle .fg { fill: var(--fg); }
    .dg-mlflow-cycle .strong { font-weight: 600; }
    .dg-mlflow-cycle .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-mlflow-cycle .small { font-size: 11px; }
    .dg-mlflow-cycle .pill { fill: var(--surface2); }
    .dg-mlflow-cycle .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-mlflow-cycle .pill.user { fill: var(--user); } .dg-mlflow-cycle .pill.infra { fill: var(--infra); }
    .dg-mlflow-cycle .pill.user .pill-text, .dg-mlflow-cycle .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-mlflow-cycle .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-mlflow-cycle-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-mlflow-cycle .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-mlflow-cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<symbol id="dg-mlflow-cycle-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-mlflow-cycle-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-mlflow-cycle-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-mlflow-cycle-i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
<symbol id="dg-mlflow-cycle-i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 17v-6M11 17V7M16 17v-3"/></symbol>
<symbol id="dg-mlflow-cycle-i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11V3Z"/><path d="M7.5 7.5h.01"/></symbol>
<symbol id="dg-mlflow-cycle-i-api" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5M15 12h5"/><rect x="9" y="8" width="6" height="8" rx="1.5"/><path d="M4 8v8M20 8v8"/></symbol>
</defs>
<rect class="bg" width="1000" height="320" rx="18"/>
<g class="grp">
<rect class="group  tint-data" x="270" y="40" width="300" height="250" rx="16"/>
<text class="group-title" x="284" y="60">Tracking · sqlite:///mlflow.db ou serveur</text>
</g>
<path class="edge flow" d="M230 160 C258 160, 258 104, 286 104" marker-end="url(#dg-mlflow-cycle-arrow)"/>
<path class="edge flow" d="M230 160 C258 160, 258 169, 286 169" marker-end="url(#dg-mlflow-cycle-arrow)"/>
<rect class="edge-label-bg" x="82.6" y="204" width="94.80000000000001" height="16" rx="4"/>
<text class="edge-label " x="130" y="216" text-anchor="middle">3 exécutions</text>
<path class="edge flow" d="M230 160 C258 160, 258 234, 286 234" marker-end="url(#dg-mlflow-cycle-arrow)"/>
<path class="edge flow" d="M550 234 C583 234, 583 145, 616 145" marker-end="url(#dg-mlflow-cycle-arrow)"/>
<rect class="edge-label-bg" x="556.4" y="195" width="67.2" height="16" rx="4"/>
<text class="edge-label " x="590" y="207" text-anchor="middle">register</text>
<path class="edge flow" d="M800 145 C818 145, 818 145, 836 145" marker-end="url(#dg-mlflow-cycle-arrow)"/>
<rect class="edge-label-bg" x="782.95" y="90" width="74.1" height="16" rx="4"/>
<text class="edge-label " x="820" y="102" text-anchor="middle">charge v3</text>
<g class="node " data-id="train">
<rect class="box" fill="var(--code)" x="30" y="130" width="200" height="60" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-code" x="44" y="148" width="24" height="24"/>
<text class="label" x="78" y="158" font-size="14">train.py</text>
<text class="sublabel" x="78" y="173" font-size="11">log_params, log_metrics</text>
</g>
<g class="node " data-id="run1">
<rect class="box" fill="var(--data)" x="290" y="80" width="260" height="48" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-chart" x="304" y="95" width="18" height="18"/>
<text class="label" x="332" y="102" font-size="13">run 1 · random_forest, depth 12</text>
<text class="sublabel" x="332" y="116" font-size="10">cv_roc_auc 0,83 · train 0,998 (surapprend)</text>
</g>
<g class="node " data-id="run2">
<rect class="box" fill="var(--data)" x="290" y="145" width="260" height="48" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-chart" x="304" y="160" width="18" height="18"/>
<text class="label" x="332" y="167" font-size="13">run 2 · random_forest, depth 6</text>
<text class="sublabel" x="332" y="181" font-size="10">cv_roc_auc 0,83 · cv_accuracy 0,77</text>
</g>
<g class="node " data-id="run3">
<rect class="box" fill="var(--data)" x="290" y="210" width="260" height="48" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-chart" x="304" y="225" width="18" height="18"/>
<text class="label" x="332" y="232" font-size="13">run 3 · logistic_regression</text>
<text class="sublabel" x="332" y="246" font-size="10">cv_roc_auc 0,84 · cv_accuracy 0,78</text>
<circle class="badge-done" cx="548" cy="212" r="10" stroke="var(--bg)" stroke-width="2.5"/>
<use class="badge-ic" href="#dg-mlflow-cycle-i-check" x="541.5" y="205.5" width="13" height="13"/>
</g>
<g class="node " data-id="registry">
<rect class="box" fill="var(--infra)" x="620" y="110" width="180" height="70" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-tag" x="634" y="133" width="24" height="24"/>
<text class="label" x="668" y="143" font-size="14">Model Registry</text>
<text class="sublabel" x="668" y="158" font-size="11">diabetes-risk · version 3</text>
</g>
<g class="node " data-id="serve">
<rect class="box" fill="var(--infra)" x="840" y="110" width="140" height="70" rx="12"/>
<use class="ic" href="#dg-mlflow-cycle-i-api" x="854" y="133" width="24" height="24"/>
<text class="label" x="888" y="143" font-size="14">Serving</text>
<text class="sublabel" x="888" y="158" font-size="11">API / endpoint</text>
</g>
<text class="note" x="420" y="308" text-anchor="middle" font-size="12">mlflow ui : comparer les runs, filtrer, choisir celui qui part en production.</text>
</svg>
