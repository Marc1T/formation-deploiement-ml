<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" class="dg dg-notebook-vs-projet" role="img" aria-labelledby="dg-notebook-vs-projet-t dg-notebook-vs-projet-d">
<title id="dg-notebook-vs-projet-t">Du notebook au projet reproductible</title>
<desc id="dg-notebook-vs-projet-d">À gauche les problèmes du notebook seul, à droite ce qui les remplace dans un projet structuré.</desc>

  <style>
    .dg-notebook-vs-projet {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-notebook-vs-projet {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-notebook-vs-projet .bg { fill: var(--bg); }
    .dg-notebook-vs-projet text { fill: var(--fg); }
    .dg-notebook-vs-projet .muted { fill: var(--muted); }
    .dg-notebook-vs-projet .label { fill: var(--nodefg); font-weight: 600; }
    .dg-notebook-vs-projet .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-notebook-vs-projet .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-notebook-vs-projet .ghost .label, .dg-notebook-vs-projet .ghost .sublabel { fill: var(--ghostfg); }
    .dg-notebook-vs-projet .ghost .ic { color: var(--muted); }
    .dg-notebook-vs-projet .ic { color: var(--nodefg); }
    .dg-notebook-vs-projet .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-notebook-vs-projet .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-notebook-vs-projet .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-notebook-vs-projet .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-notebook-vs-projet .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-notebook-vs-projet .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-notebook-vs-projet .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-notebook-vs-projet .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-notebook-vs-projet .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-notebook-vs-projet .edge.thin { stroke-width: 1.6; }
    .dg-notebook-vs-projet .edge.dashed { stroke-dasharray: 6 6; }
    .dg-notebook-vs-projet .edge.flow { stroke-dasharray: 9 8; animation: dg-notebook-vs-projet-flow 1.1s linear infinite; }
    .dg-notebook-vs-projet .edge.slow { animation-duration: 2.2s; }
    .dg-notebook-vs-projet .edge.accent { stroke: var(--accent); }
    .dg-notebook-vs-projet .edge.warn { stroke: var(--accent2); }
    .dg-notebook-vs-projet .edge.ok { stroke: var(--ok); }
    .dg-notebook-vs-projet .edge.err { stroke: var(--err); }
    .dg-notebook-vs-projet .edge.data { stroke: var(--data); }
    .dg-notebook-vs-projet .edge.ai { stroke: var(--ai); }
    .dg-notebook-vs-projet .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-notebook-vs-projet .arrow { fill: var(--muted); }
    .dg-notebook-vs-projet .arrow.accent { fill: var(--accent); } .dg-notebook-vs-projet .arrow.warn { fill: var(--accent2); }
    .dg-notebook-vs-projet .arrow.ok { fill: var(--ok); } .dg-notebook-vs-projet .arrow.err { fill: var(--err); }
    .dg-notebook-vs-projet .arrow.data { fill: var(--data); } .dg-notebook-vs-projet .arrow.ai { fill: var(--ai); }
    .dg-notebook-vs-projet .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-notebook-vs-projet .edge-label.fg { fill: var(--fg); }
    .dg-notebook-vs-projet .edge-label-bg { fill: var(--bg); }
    .dg-notebook-vs-projet .badge-done { fill: var(--ok); } .dg-notebook-vs-projet .badge-err { fill: var(--err); } .dg-notebook-vs-projet .badge-run { fill: var(--accent2); }
    .dg-notebook-vs-projet .badge-ic { color: #fff; }
    .dg-notebook-vs-projet .note { fill: var(--muted); font-size: 12px; }
    .dg-notebook-vs-projet .fg { fill: var(--fg); }
    .dg-notebook-vs-projet .strong { font-weight: 600; }
    .dg-notebook-vs-projet .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-notebook-vs-projet .small { font-size: 11px; }
    .dg-notebook-vs-projet .pill { fill: var(--surface2); }
    .dg-notebook-vs-projet .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-notebook-vs-projet .pill.user { fill: var(--user); } .dg-notebook-vs-projet .pill.infra { fill: var(--infra); }
    .dg-notebook-vs-projet .pill.user .pill-text, .dg-notebook-vs-projet .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-notebook-vs-projet .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-notebook-vs-projet-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-notebook-vs-projet .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-notebook-vs-projet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<marker id="dg-notebook-vs-projet-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow accent"/></marker>
<symbol id="dg-notebook-vs-projet-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-notebook-vs-projet-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-notebook-vs-projet-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-notebook-vs-projet-i-notebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M12 8h5M12 12h5"/></symbol>
<symbol id="dg-notebook-vs-projet-i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></symbol>
<symbol id="dg-notebook-vs-projet-i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="dg-notebook-vs-projet-i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10M8 5l8 4"/></symbol>
<symbol id="dg-notebook-vs-projet-i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6Z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="dg-notebook-vs-projet-i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
<symbol id="dg-notebook-vs-projet-i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 17v-6M11 17V7M16 17v-3"/></symbol>
</defs>
<rect class="bg" width="1000" height="360" rx="18"/>
<g class="grp">
<rect class="group dashed" x="30" y="30" width="400" height="300" rx="16"/>
<text class="group-title" x="44" y="50">Notebook seul</text>
</g>
<g class="grp">
<rect class="group  tint-infra" x="570" y="30" width="400" height="300" rx="16"/>
<text class="group-title" x="584" y="50">Projet reproductible</text>
</g>
<path class="edge flow accent" d="M440 180 L560 180" marker-end="url(#dg-notebook-vs-projet-arrow-accent)"/>
<rect class="edge-label-bg" x="459.5" y="160" width="81" height="16" rx="4"/>
<text class="edge-label " x="500" y="172" text-anchor="middle">labs 1 à 3</text>
<g class="node ghost" data-id="n1">
<rect class="box"  x="50" y="70" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-notebook" x="64" y="87" width="18" height="18"/>
<text class="label" x="92" y="94" font-size="14">Cellules exécutées dans le désordre</text>
<text class="sublabel" x="92" y="109" font-size="11">résultat impossible à reproduire</text>
</g>
<g class="node ghost" data-id="n2">
<rect class="box"  x="50" y="132" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-terminal" x="64" y="149" width="18" height="18"/>
<text class="label" x="92" y="156" font-size="14">pip install à la main</text>
<text class="sublabel" x="92" y="171" font-size="11">versions inconnues, « ça marche chez moi »</text>
</g>
<g class="node ghost" data-id="n3">
<rect class="box"  x="50" y="194" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-database" x="64" y="211" width="18" height="18"/>
<text class="label" x="92" y="218" font-size="14">data.csv sur le bureau</text>
<text class="sublabel" x="92" y="233" font-size="11">introuvable pour les autres et pour la CI</text>
</g>
<g class="node ghost" data-id="n4">
<rect class="box"  x="50" y="256" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-package" x="64" y="273" width="18" height="18"/>
<text class="label" x="92" y="280" font-size="14">model_final_v2.pkl</text>
<text class="sublabel" x="92" y="295" font-size="11">lequel est en production ? entraîné comment ?</text>
</g>
<g class="node " data-id="p1">
<rect class="box" fill="var(--code)" x="590" y="70" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-file" x="604" y="87" width="18" height="18"/>
<text class="label" x="632" y="94" font-size="14">pyproject.toml + uv.lock</text>
<text class="sublabel" x="632" y="109" font-size="11">dépendances exactes, uv sync</text>
</g>
<g class="node " data-id="p2">
<rect class="box" fill="var(--code)" x="590" y="132" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-code" x="604" y="149" width="18" height="18"/>
<text class="label" x="632" y="156" font-size="14">src/ + tests/</text>
<text class="sublabel" x="632" y="171" font-size="11">code importable, testé, relancé par la CI</text>
</g>
<g class="node " data-id="p3">
<rect class="box" fill="var(--data)" x="590" y="194" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-database" x="604" y="211" width="18" height="18"/>
<text class="label" x="632" y="218" font-size="14">data/ suivi par DVC</text>
<text class="sublabel" x="632" y="233" font-size="11">données versionnées, remote partagé</text>
</g>
<g class="node " data-id="p4">
<rect class="box" fill="var(--data)" x="590" y="256" width="360" height="52" rx="12"/>
<use class="ic" href="#dg-notebook-vs-projet-i-chart" x="604" y="273" width="18" height="18"/>
<text class="label" x="632" y="280" font-size="14">models/ + run MLflow</text>
<text class="sublabel" x="632" y="295" font-size="11">modèle tracé : paramètres, métriques, date</text>
</g>
</svg>
