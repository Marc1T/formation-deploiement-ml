<path class="edge flow" d="M530 128 C540.5 128, 540.5 128, 551 128" marker-end="url(#dg-gcp-cloud-run-arrow)"/>
<rect class="edge-label-bg" x="522.2" y="72" width="39.6" height="16" rx="4"/>
