<use class="ic" href="#dg-gcp-cloud-run-i-gear" x="443" y="108" width="24" height="24"/>
<text class="label" x="455" y="150" text-anchor="middle" font-size="14">Cloud Build</text>
</g>
<g class="node " data-id="reg">
<rect class="box" fill="var(--infra)" x="555" y="96" width="150" height="64" rx="12"/>
