<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" width="1160" height="320" class="dg dg-azure-ml-vs-vertex" role="img" aria-labelledby="dg-azure-ml-vs-vertex-t dg-azure-ml-vs-vertex-d">
<title id="dg-azure-ml-vs-vertex-t">Azure ML et Vertex AI : les mêmes étapes, des noms différents</title>
<desc id="dg-azure-ml-vs-vertex-d">Pour chaque étape du cycle de vie, le service correspondant chez Microsoft et chez Google.</desc>

  <style>
    .dg-azure-ml-vs-vertex {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-azure-ml-vs-vertex {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-azure-ml-vs-vertex .bg { fill: var(--bg); }
    .dg-azure-ml-vs-vertex text { fill: var(--fg); }
    .dg-azure-ml-vs-vertex .muted { fill: var(--muted); }
    .dg-azure-ml-vs-vertex .label { fill: var(--nodefg); font-weight: 600; }
    .dg-azure-ml-vs-vertex .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-azure-ml-vs-vertex .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-azure-ml-vs-vertex .ghost .label, .dg-azure-ml-vs-vertex .ghost .sublabel { fill: var(--ghostfg); }
    .dg-azure-ml-vs-vertex .ghost .ic { color: var(--muted); }
    .dg-azure-ml-vs-vertex .ic { color: var(--nodefg); }
    .dg-azure-ml-vs-vertex .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-azure-ml-vs-vertex .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-azure-ml-vs-vertex .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-azure-ml-vs-vertex .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-azure-ml-vs-vertex .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-azure-ml-vs-vertex .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-azure-ml-vs-vertex .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-azure-ml-vs-vertex .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-azure-ml-vs-vertex .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-azure-ml-vs-vertex .edge.thin { stroke-width: 1.6; }
    .dg-azure-ml-vs-vertex .edge.dashed { stroke-dasharray: 6 6; }
    .dg-azure-ml-vs-vertex .edge.flow { stroke-dasharray: 9 8; animation: dg-azure-ml-vs-vertex-flow 1.1s linear infinite; }
    .dg-azure-ml-vs-vertex .edge.slow { animation-duration: 2.2s; }
    .dg-azure-ml-vs-vertex .edge.accent { stroke: var(--accent); }
    .dg-azure-ml-vs-vertex .edge.warn { stroke: var(--accent2); }
    .dg-azure-ml-vs-vertex .edge.ok { stroke: var(--ok); }
    .dg-azure-ml-vs-vertex .edge.err { stroke: var(--err); }
    .dg-azure-ml-vs-vertex .edge.data { stroke: var(--data); }
    .dg-azure-ml-vs-vertex .edge.ai { stroke: var(--ai); }
    .dg-azure-ml-vs-vertex .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-azure-ml-vs-vertex .arrow { fill: var(--muted); }
    .dg-azure-ml-vs-vertex .arrow.accent { fill: var(--accent); } .dg-azure-ml-vs-vertex .arrow.warn { fill: var(--accent2); }
    .dg-azure-ml-vs-vertex .arrow.ok { fill: var(--ok); } .dg-azure-ml-vs-vertex .arrow.err { fill: var(--err); }
    .dg-azure-ml-vs-vertex .arrow.data { fill: var(--data); } .dg-azure-ml-vs-vertex .arrow.ai { fill: var(--ai); }
    .dg-azure-ml-vs-vertex .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-azure-ml-vs-vertex .edge-label.fg { fill: var(--fg); }
    .dg-azure-ml-vs-vertex .edge-label-bg { fill: var(--bg); }
    .dg-azure-ml-vs-vertex .badge-done { fill: var(--ok); } .dg-azure-ml-vs-vertex .badge-err { fill: var(--err); } .dg-azure-ml-vs-vertex .badge-run { fill: var(--accent2); }
    .dg-azure-ml-vs-vertex .badge-ic { color: #fff; }
    .dg-azure-ml-vs-vertex .note { fill: var(--muted); font-size: 12px; }
    .dg-azure-ml-vs-vertex .fg { fill: var(--fg); }
    .dg-azure-ml-vs-vertex .strong { font-weight: 600; }
    .dg-azure-ml-vs-vertex .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-azure-ml-vs-vertex .small { font-size: 11px; }
    .dg-azure-ml-vs-vertex .pill { fill: var(--surface2); }
    .dg-azure-ml-vs-vertex .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-azure-ml-vs-vertex .pill.user { fill: var(--user); } .dg-azure-ml-vs-vertex .pill.infra { fill: var(--infra); }
    .dg-azure-ml-vs-vertex .pill.user .pill-text, .dg-azure-ml-vs-vertex .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-azure-ml-vs-vertex .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-azure-ml-vs-vertex-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-azure-ml-vs-vertex .edge.flow { animation: none; } }
  </style>
