<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" class="dg dg-compose-services" role="img" aria-labelledby="dg-compose-services-t dg-compose-services-d">
<title id="dg-compose-services-t">Docker Compose : trois services sur un réseau interne</title>
<desc id="dg-compose-services-d">Le navigateur accède aux ports publiés ; à l’intérieur du réseau, l’application appelle l’API par son nom de service.</desc>

  <style>
    .dg-compose-services {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-compose-services {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-compose-services .bg { fill: var(--bg); }
    .dg-compose-services text { fill: var(--fg); }
    .dg-compose-services .muted { fill: var(--muted); }
    .dg-compose-services .label { fill: var(--nodefg); font-weight: 600; }
    .dg-compose-services .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-compose-services .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-compose-services .ghost .label, .dg-compose-services .ghost .sublabel { fill: var(--ghostfg); }
    .dg-compose-services .ghost .ic { color: var(--muted); }
    .dg-compose-services .ic { color: var(--nodefg); }
    .dg-compose-services .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-compose-services .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-compose-services .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-compose-services .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-compose-services .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-compose-services .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-compose-services .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-compose-services .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-compose-services .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-compose-services .edge.thin { stroke-width: 1.6; }
    .dg-compose-services .edge.dashed { stroke-dasharray: 6 6; }
    .dg-compose-services .edge.flow { stroke-dasharray: 9 8; animation: dg-compose-services-flow 1.1s linear infinite; }
    .dg-compose-services .edge.slow { animation-duration: 2.2s; }
    .dg-compose-services .edge.accent { stroke: var(--accent); }
    .dg-compose-services .edge.warn { stroke: var(--accent2); }
    .dg-compose-services .edge.ok { stroke: var(--ok); }
    .dg-compose-services .edge.err { stroke: var(--err); }
    .dg-compose-services .edge.data { stroke: var(--data); }
    .dg-compose-services .edge.ai { stroke: var(--ai); }
    .dg-compose-services .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-compose-services .arrow { fill: var(--muted); }
    .dg-compose-services .arrow.accent { fill: var(--accent); } .dg-compose-services .arrow.warn { fill: var(--accent2); }
    .dg-compose-services .arrow.ok { fill: var(--ok); } .dg-compose-services .arrow.err { fill: var(--err); }
    .dg-compose-services .arrow.data { fill: var(--data); } .dg-compose-services .arrow.ai { fill: var(--ai); }
    .dg-compose-services .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-compose-services .edge-label.fg { fill: var(--fg); }
    .dg-compose-services .edge-label-bg { fill: var(--bg); }
    .dg-compose-services .badge-done { fill: var(--ok); } .dg-compose-services .badge-err { fill: var(--err); } .dg-compose-services .badge-run { fill: var(--accent2); }
    .dg-compose-services .badge-ic { color: #fff; }
    .dg-compose-services .note { fill: var(--muted); font-size: 12px; }
    .dg-compose-services .fg { fill: var(--fg); }
    .dg-compose-services .strong { font-weight: 600; }
    .dg-compose-services .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-compose-services .small { font-size: 11px; }
    .dg-compose-services .pill { fill: var(--surface2); }
    .dg-compose-services .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-compose-services .pill.user { fill: var(--user); } .dg-compose-services .pill.infra { fill: var(--infra); }
    .dg-compose-services .pill.user .pill-text, .dg-compose-services .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-compose-services .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-compose-services-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-compose-services .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-compose-services-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<symbol id="dg-compose-services-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-compose-services-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-compose-services-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-compose-services-i-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></symbol>
<symbol id="dg-compose-services-i-api" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5M15 12h5"/><rect x="9" y="8" width="6" height="8" rx="1.5"/><path d="M4 8v8M20 8v8"/></symbol>
<symbol id="dg-compose-services-i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
<symbol id="dg-compose-services-i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 17v-6M11 17V7M16 17v-3"/></symbol>
<symbol id="dg-compose-services-i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
</defs>
<rect class="bg" width="1000" height="300" rx="18"/>
<g class="grp">
<rect class="group dashed" x="300" y="24" width="670" height="258" rx="16"/>
<text class="group-title" x="314" y="44">docker compose · réseau interne (DNS par nom de service)</text>
</g>
