# Déploiement continu (parcours avancé) : met à jour l'Azure Container App avec
# l'image publiée par le workflow CI. Déclenchement manuel, pour garder la main.
#
# Prérequis (une fois) :
#   1. L'application existe déjà (deploy/azure/deploy.ps1 ou deploy.sh).
#   2. Un principal de service avec le rôle Contributor sur le groupe de ressources :
#        az ad sp create-for-rbac --name gh-diabetes --role contributor \
#          --scopes /subscriptions/<id>/resourceGroups/rg-diabetes-ml --json-auth
#      Coller la sortie JSON dans le secret GitHub AZURE_CREDENTIALS.
#   3. Si l'image ghcr.io est privée : rendre le package public (Package settings)
#      ou configurer les identifiants du registre sur la Container App.

name: Déployer sur Azure

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image à déployer (ex. latest ou un SHA)"
        required: true
        default: latest
      resource_group:
        description: "Groupe de ressources"
        required: true
        default: rg-diabetes-ml
      app_name:
        description: "Nom de la Container App"
        required: true
        default: diabetes-api

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Mettre à jour l'image de la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ inputs.app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --image "ghcr.io/${{ github.repository }}/api:${{ inputs.tag }}" \
            --output none
          FQDN=$(az containerapp show --name "${{ inputs.app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "API : https://$FQDN/docs" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la santé
        run: |
          FQDN=$(az containerapp show --name "${{ inputs.app_name }}" \
            --resource-group "${{ inputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$FQDN/health"; then exit 0; fi
            sleep 10
          done
          echo "L'API ne répond pas" && exit 1
