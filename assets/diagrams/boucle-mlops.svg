<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" class="dg dg-boucle-mlops" role="img" aria-labelledby="dg-boucle-mlops-t dg-boucle-mlops-d">
<title id="dg-boucle-mlops-t">La boucle : données, entraînement, déploiement, supervision</title>
<desc id="dg-boucle-mlops-d">Le déploiement n’est pas une fin : la supervision produit de nouvelles données qui relancent l’entraînement.</desc>

  <style>
    .dg-boucle-mlops {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-boucle-mlops {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-boucle-mlops .bg { fill: var(--bg); }
    .dg-boucle-mlops text { fill: var(--fg); }
    .dg-boucle-mlops .muted { fill: var(--muted); }
    .dg-boucle-mlops .label { fill: var(--nodefg); font-weight: 600; }
    .dg-boucle-mlops .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-boucle-mlops .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-boucle-mlops .ghost .label, .dg-boucle-mlops .ghost .sublabel { fill: var(--ghostfg); }
    .dg-boucle-mlops .ghost .ic { color: var(--muted); }
    .dg-boucle-mlops .ic { color: var(--nodefg); }
    .dg-boucle-mlops .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-boucle-mlops .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-boucle-mlops .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-boucle-mlops .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-boucle-mlops .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-boucle-mlops .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-boucle-mlops .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-boucle-mlops .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-boucle-mlops .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-boucle-mlops .edge.thin { stroke-width: 1.6; }
    .dg-boucle-mlops .edge.dashed { stroke-dasharray: 6 6; }
    .dg-boucle-mlops .edge.flow { stroke-dasharray: 9 8; animation: dg-boucle-mlops-flow 1.1s linear infinite; }
    .dg-boucle-mlops .edge.slow { animation-duration: 2.2s; }
    .dg-boucle-mlops .edge.accent { stroke: var(--accent); }
    .dg-boucle-mlops .edge.warn { stroke: var(--accent2); }
    .dg-boucle-mlops .edge.ok { stroke: var(--ok); }
    .dg-boucle-mlops .edge.err { stroke: var(--err); }
    .dg-boucle-mlops .edge.data { stroke: var(--data); }
    .dg-boucle-mlops .edge.ai { stroke: var(--ai); }
    .dg-boucle-mlops .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-boucle-mlops .arrow { fill: var(--muted); }
    .dg-boucle-mlops .arrow.accent { fill: var(--accent); } .dg-boucle-mlops .arrow.warn { fill: var(--accent2); }
    .dg-boucle-mlops .arrow.ok { fill: var(--ok); } .dg-boucle-mlops .arrow.err { fill: var(--err); }
    .dg-boucle-mlops .arrow.data { fill: var(--data); } .dg-boucle-mlops .arrow.ai { fill: var(--ai); }
    .dg-boucle-mlops .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-boucle-mlops .edge-label.fg { fill: var(--fg); }
    .dg-boucle-mlops .edge-label-bg { fill: var(--bg); }
    .dg-boucle-mlops .badge-done { fill: var(--ok); } .dg-boucle-mlops .badge-err { fill: var(--err); } .dg-boucle-mlops .badge-run { fill: var(--accent2); }
    .dg-boucle-mlops .badge-ic { color: #fff; }
    .dg-boucle-mlops .note { fill: var(--muted); font-size: 12px; }
    .dg-boucle-mlops .fg { fill: var(--fg); }
    .dg-boucle-mlops .strong { font-weight: 600; }
    .dg-boucle-mlops .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-boucle-mlops .small { font-size: 11px; }
    .dg-boucle-mlops .pill { fill: var(--surface2); }
    .dg-boucle-mlops .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-boucle-mlops .pill.user { fill: var(--user); } .dg-boucle-mlops .pill.infra { fill: var(--infra); }
    .dg-boucle-mlops .pill.user .pill-text, .dg-boucle-mlops .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-boucle-mlops .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-boucle-mlops-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-boucle-mlops .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-boucle-mlops-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<symbol id="dg-boucle-mlops-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-boucle-mlops-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-boucle-mlops-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-boucle-mlops-i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
<symbol id="dg-boucle-mlops-i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><circle cx="12" cy="13" r="2.2"/><path d="M12 7.2v3.6M10.4 14.6l-4 2.8M13.6 14.6l4 2.8"/></symbol>
<symbol id="dg-boucle-mlops-i-rocket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3c3 0 7 1 7 7-3 3-6 6-9 7l-4-4c1-3 3-7 6-10Z"/><path d="M8 13l-4 1 3-5M11 16l-1 4 5-3"/><circle cx="15" cy="9" r="1.5"/></symbol>
<symbol id="dg-boucle-mlops-i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
</defs>
<rect class="bg" width="900" height="420" rx="18"/>
<path class="edge flow" d="M550 60 Q735 60 735 176" marker-end="url(#dg-boucle-mlops-arrow)"/>
<rect class="edge-label-bg" x="666.4" y="110" width="67.2" height="16" rx="4"/>
<text class="edge-label " x="700" y="122" text-anchor="middle">entraîne</text>
<path class="edge flow" d="M735 240 Q735 360 554 360" marker-end="url(#dg-boucle-mlops-arrow)"/>
<rect class="edge-label-bg" x="673.3" y="310" width="53.400000000000006" height="16" rx="4"/>
<text class="edge-label " x="700" y="322" text-anchor="middle">publie</text>
<path class="edge flow" d="M350 360 Q165 360 165 244" marker-end="url(#dg-boucle-mlops-arrow)"/>
<rect class="edge-label-bg" x="169.85" y="310" width="60.300000000000004" height="16" rx="4"/>
<text class="edge-label " x="200" y="322" text-anchor="middle">observe</text>
<path class="edge flow" d="M165 180 Q165 60 346 60" marker-end="url(#dg-boucle-mlops-arrow)"/>
<rect class="edge-label-bg" x="166.4" y="110" width="67.2" height="16" rx="4"/>
<text class="edge-label " x="200" y="122" text-anchor="middle">collecte</text>
<g class="node " data-id="data">
<rect class="box" fill="var(--data)" x="350" y="30" width="200" height="60" rx="12"/>
<use class="ic" href="#dg-boucle-mlops-i-database" x="364" y="48" width="24" height="24"/>
<text class="label" x="398" y="58" font-size="14">Données</text>
<text class="sublabel" x="398" y="73" font-size="11">nouvelles observations</text>
</g>
<g class="node " data-id="train">
<rect class="box" fill="var(--code)" x="620" y="180" width="230" height="60" rx="12"/>
<use class="ic" href="#dg-boucle-mlops-i-model" x="634" y="198" width="24" height="24"/>
<text class="label" x="668" y="208" font-size="14">Entraînement</text>
<text class="sublabel" x="668" y="223" font-size="11">DVC + MLflow</text>
</g>
<g class="node " data-id="deploy">
<rect class="box" fill="var(--infra)" x="350" y="330" width="200" height="60" rx="12"/>
<use class="ic" href="#dg-boucle-mlops-i-rocket" x="364" y="348" width="24" height="24"/>
<text class="label" x="398" y="358" font-size="14">Déploiement</text>
<text class="sublabel" x="398" y="373" font-size="11">image → cloud</text>
</g>
<g class="node " data-id="monitor">
<rect class="box" fill="var(--infra)" x="50" y="180" width="230" height="60" rx="12"/>
<use class="ic" href="#dg-boucle-mlops-i-eye" x="64" y="198" width="24" height="24"/>
<text class="label" x="98" y="208" font-size="14">Supervision</text>
<text class="sublabel" x="98" y="223" font-size="11">métriques, dérive, retours</text>
</g>
<text class="note title" x="450" y="205" text-anchor="middle" font-size="12">La boucle MLOps</text>
<text class="note" x="450" y="228" text-anchor="middle" font-size="12">chaque tour améliore le modèle</text>
</svg>
