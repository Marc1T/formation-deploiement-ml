<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 270" width="1020" height="270" class="dg dg-uv-workflow" role="img" aria-labelledby="dg-uv-workflow-t dg-uv-workflow-d">
<title id="dg-uv-workflow-t">Le cycle uv : déclarer, figer, installer, exécuter</title>
<desc id="dg-uv-workflow-d">pyproject.toml déclare les dépendances, uv.lock fige les versions, uv sync crée .venv, uv run exécute dedans.</desc>

  <style>
    .dg-uv-workflow {
      --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#E9EDF3; --fg:#17202B; --muted:#5D6B7D;
      --line:#D3DAE4; --line2:#B9C3D1; --accent:#0E6E8E; --accent2:#D9731A; --ok:#1D8F5A; --err:#C73E3E;
      --data:#6D4FD3; --code:#0E6E8E; --infra:#1D8F5A; --user:#B8471B; --ai:#B5338A; --neutral:#8B97A8;
      --nodefg:#FFFFFF; --ghostfg:#17202B;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .dg-uv-workflow {
        --bg:#0D141D; --surface:#141D29; --surface2:#1B2634; --fg:#E7ECF3; --muted:#9AA9BB;
        --line:#2B3A4C; --line2:#3C4D62; --accent:#4FB3D9; --accent2:#F0A050; --ok:#3FC27F; --err:#F26B6B;
        --data:#A08BF0; --code:#4FB3D9; --infra:#3FC27F; --user:#F08A5B; --ai:#E27AC0; --neutral:#6B7A8C;
        --nodefg:#0D141D; --ghostfg:#E7ECF3;
      }
    }
    .dg-uv-workflow .bg { fill: var(--bg); }
    .dg-uv-workflow text { fill: var(--fg); }
    .dg-uv-workflow .muted { fill: var(--muted); }
    .dg-uv-workflow .label { fill: var(--nodefg); font-weight: 600; }
    .dg-uv-workflow .sublabel { fill: var(--nodefg); opacity: .85; }
    .dg-uv-workflow .ghost .box { fill: var(--surface); stroke: var(--line2); stroke-dasharray: 6 5; stroke-width: 1.6; }
    .dg-uv-workflow .ghost .label, .dg-uv-workflow .ghost .sublabel { fill: var(--ghostfg); }
    .dg-uv-workflow .ghost .ic { color: var(--muted); }
    .dg-uv-workflow .ic { color: var(--nodefg); }
    .dg-uv-workflow .group { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-uv-workflow .group.dashed { fill: none; stroke: var(--line2); stroke-dasharray: 7 6; }
    .dg-uv-workflow .group.tint-data { fill: color-mix(in srgb, var(--data) 8%, var(--surface)); }
    .dg-uv-workflow .group.tint-infra { fill: color-mix(in srgb, var(--infra) 8%, var(--surface)); }
    .dg-uv-workflow .group.tint-user { fill: color-mix(in srgb, var(--user) 8%, var(--surface)); }
    .dg-uv-workflow .group.tint-code { fill: color-mix(in srgb, var(--code) 8%, var(--surface)); }
    .dg-uv-workflow .group.tint-ai { fill: color-mix(in srgb, var(--ai) 8%, var(--surface)); }
    .dg-uv-workflow .group-title { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .dg-uv-workflow .edge { fill: none; stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; }
    .dg-uv-workflow .edge.thin { stroke-width: 1.6; }
    .dg-uv-workflow .edge.dashed { stroke-dasharray: 6 6; }
    .dg-uv-workflow .edge.flow { stroke-dasharray: 9 8; animation: dg-uv-workflow-flow 1.1s linear infinite; }
    .dg-uv-workflow .edge.slow { animation-duration: 2.2s; }
    .dg-uv-workflow .edge.accent { stroke: var(--accent); }
    .dg-uv-workflow .edge.warn { stroke: var(--accent2); }
    .dg-uv-workflow .edge.ok { stroke: var(--ok); }
    .dg-uv-workflow .edge.err { stroke: var(--err); }
    .dg-uv-workflow .edge.data { stroke: var(--data); }
    .dg-uv-workflow .edge.ai { stroke: var(--ai); }
    .dg-uv-workflow .edge.lifeline { stroke: var(--line2); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dg-uv-workflow .arrow { fill: var(--muted); }
    .dg-uv-workflow .arrow.accent { fill: var(--accent); } .dg-uv-workflow .arrow.warn { fill: var(--accent2); }
    .dg-uv-workflow .arrow.ok { fill: var(--ok); } .dg-uv-workflow .arrow.err { fill: var(--err); }
    .dg-uv-workflow .arrow.data { fill: var(--data); } .dg-uv-workflow .arrow.ai { fill: var(--ai); }
    .dg-uv-workflow .edge-label { fill: var(--muted); font-size: 11.5px; font-family: "JetBrains Mono", Consolas, monospace; }
    .dg-uv-workflow .edge-label.fg { fill: var(--fg); }
    .dg-uv-workflow .edge-label-bg { fill: var(--bg); }
    .dg-uv-workflow .badge-done { fill: var(--ok); } .dg-uv-workflow .badge-err { fill: var(--err); } .dg-uv-workflow .badge-run { fill: var(--accent2); }
    .dg-uv-workflow .badge-ic { color: #fff; }
    .dg-uv-workflow .note { fill: var(--muted); font-size: 12px; }
    .dg-uv-workflow .fg { fill: var(--fg); }
    .dg-uv-workflow .strong { font-weight: 600; }
    .dg-uv-workflow .title { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .dg-uv-workflow .small { font-size: 11px; }
    .dg-uv-workflow .pill { fill: var(--surface2); }
    .dg-uv-workflow .pill-text { fill: var(--fg); font-size: 11.5px; font-weight: 600; }
    .dg-uv-workflow .pill.user { fill: var(--user); } .dg-uv-workflow .pill.infra { fill: var(--infra); }
    .dg-uv-workflow .pill.user .pill-text, .dg-uv-workflow .pill.infra .pill-text { fill: var(--nodefg); }
    .dg-uv-workflow .cross { stroke: var(--err); stroke-width: 3; stroke-linecap: round; }
    @keyframes dg-uv-workflow-flow { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { .dg-uv-workflow .edge.flow { animation: none; } }
  </style>
<defs>
<marker id="dg-uv-workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrow "/></marker>
<symbol id="dg-uv-workflow-i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></symbol>
<symbol id="dg-uv-workflow-i-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="dg-uv-workflow-i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L3 9M4 13a8 8 0 0 0 14.5 4.5L21 15"/><path d="M3 4v5h5M21 20v-5h-5"/></symbol>
<symbol id="dg-uv-workflow-i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6Z"/><path d="M14 2v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="dg-uv-workflow-i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="dg-uv-workflow-i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4V7Z"/><path d="M4 7l8 4 8-4M12 11v10M8 5l8 4"/></symbol>
<symbol id="dg-uv-workflow-i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8Z"/></symbol>
<symbol id="dg-uv-workflow-i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></symbol>
<symbol id="dg-uv-workflow-i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
</defs>
<rect class="bg" width="1020" height="270" rx="18"/>
<path class="edge flow" d="M230 140 C258 140, 258 140, 286 140" marker-end="url(#dg-uv-workflow-arrow)"/>
<rect class="edge-label-bg" x="196.8" y="121" width="122.4" height="16" rx="4"/>
<text class="edge-label " x="258" y="133" text-anchor="middle">uv add · uv lock</text>
<path class="edge flow" d="M480 140 C508 140, 508 140, 536 140" marker-end="url(#dg-uv-workflow-arrow)"/>
<rect class="edge-label-bg" x="477.85" y="121" width="60.300000000000004" height="16" rx="4"/>
<text class="edge-label " x="508" y="133" text-anchor="middle">uv sync</text>
<path class="edge flow" d="M730 140 C758 140, 758 140, 786 140" marker-end="url(#dg-uv-workflow-arrow)"/>
<path class="edge dashed  thin" d="M635 64 C635 85, 635 85, 635 106" marker-end="url(#dg-uv-workflow-arrow)"/>
<path class="edge dashed  thin" d="M480 227 C508 227, 508 140, 536 140" marker-end="url(#dg-uv-workflow-arrow)"/>
<rect class="edge-label-bg" x="439.9" y="164.5" width="136.2" height="16" rx="4"/>
<text class="edge-label " x="508" y="176.5" text-anchor="middle">même environnement</text>
<g class="node " data-id="py">
<rect class="box" fill="var(--code)" x="40" y="110" width="190" height="60" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-file" x="54" y="128" width="24" height="24"/>
<text class="label" x="88" y="138" font-size="14">pyproject.toml</text>
<text class="sublabel" x="88" y="153" font-size="11">dépendances déclarées</text>
</g>
<g class="node " data-id="lock">
<rect class="box" fill="var(--code)" x="290" y="110" width="190" height="60" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-lock" x="304" y="128" width="24" height="24"/>
<text class="label" x="338" y="138" font-size="14">uv.lock</text>
<text class="sublabel" x="338" y="153" font-size="11">versions exactes, figées</text>
</g>
<g class="node " data-id="venv">
<rect class="box" fill="var(--infra)" x="540" y="110" width="190" height="60" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-package" x="554" y="128" width="24" height="24"/>
<text class="label" x="588" y="138" font-size="14">.venv</text>
<text class="sublabel" x="588" y="153" font-size="11">créé par uv sync</text>
</g>
<g class="node " data-id="run">
<rect class="box" fill="var(--code)" x="790" y="110" width="190" height="60" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-play" x="804" y="128" width="24" height="24"/>
<text class="label" x="838" y="138" font-size="14">uv run …</text>
<text class="sublabel" x="838" y="153" font-size="11">dans l’environnement</text>
</g>
<g class="node " data-id="python">
<rect class="box" fill="var(--neutral)" x="540" y="20" width="190" height="44" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-terminal" x="554" y="33" width="18" height="18"/>
<text class="label" x="582" y="40" font-size="13">Python 3.11</text>
<text class="sublabel" x="582" y="54" font-size="10">uv python install</text>
</g>
<g class="node " data-id="peer">
<rect class="box" fill="var(--user)" x="290" y="205" width="190" height="44" rx="12"/>
<use class="ic" href="#dg-uv-workflow-i-user" x="304" y="218" width="18" height="18"/>
<text class="label" x="332" y="225" font-size="13">Collègue ou CI</text>
<text class="sublabel" x="332" y="239" font-size="10">git clone puis uv sync</text>
</g>
</svg>
